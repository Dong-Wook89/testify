<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HWPX 다중문서 폐쇄망 검색챗봇</title>
  <style>
    :root{--bg:#eef3f8;--panel:#fff;--ink:#142033;--muted:#66758a;--line:#dce5ef;--brand:#176b87;--brand2:#64ccc5;--danger:#b23a48;--shadow:0 18px 50px rgba(31,55,78,.12)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#d9f3ef 0,transparent 35%),var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
    .app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.side{padding:28px 20px;background:#102b3a;color:#eefaff}.brand{font-size:20px;font-weight:800;letter-spacing:-.4px}.sub{color:#b8d1dc;font-size:13px;margin:4px 0 22px}.drop{border:1.5px dashed #72b8c1;border-radius:16px;padding:23px 14px;text-align:center;background:#173a4b;transition:.2s}.drop.drag{background:#215166;transform:scale(1.01)}
    button,.filebtn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.filebtn{display:inline-block;background:var(--brand2);color:#09252d;margin-top:10px}input[type=file]{display:none}.docs{margin-top:18px;display:grid;gap:9px}.doc{background:#173a4b;border-radius:12px;padding:10px 11px}.docrow{display:flex;align-items:center;gap:8px}.docname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.doc small{color:#9fc0cc}.remove{background:transparent;color:#ffb1b8;padding:3px 6px}.sideactions{display:flex;gap:8px;margin-top:15px}.sideactions button{flex:1;background:#24495a;color:#eaf8fb}.privacy{font-size:12px;color:#92b3c0;margin-top:18px}
    main{padding:34px;display:flex;justify-content:center}.shell{width:min(980px,100%);display:flex;flex-direction:column;gap:18px}.hero h1{font-size:29px;margin:0;letter-spacing:-1px}.hero p{color:var(--muted);margin:5px 0 0}.chat{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:570px;display:flex;flex-direction:column;overflow:hidden}.messages{padding:24px;display:flex;flex-direction:column;gap:16px;flex:1;overflow:auto}.msg{max-width:88%;border-radius:16px;padding:13px 15px}.user{align-self:flex-end;background:var(--brand);color:#fff}.bot{align-self:flex-start;background:#f3f7fa;border:1px solid var(--line)}.welcome{max-width:680px}.results{display:grid;gap:12px;margin-top:10px}.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.resulthead{display:flex;gap:10px;align-items:center}.rank{width:27px;height:27px;border-radius:9px;background:#dff5f2;color:#12556a;text-align:center;font-weight:800}.score{margin-left:auto;color:var(--brand);font-weight:800}.meta{color:var(--muted);font-size:12px;margin:4px 0 8px}.quote{white-space:pre-wrap}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);background:#fbfdff}.composer input{flex:1;border:1px solid #cbd8e3;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}.composer input:focus{border-color:var(--brand)}.composer button{background:var(--brand);color:#fff;min-width:82px}.composer button:disabled{opacity:.45}.empty{color:#9fc0cc;text-align:center;padding:10px;font-size:13px}mark{background:#fff0a8;border-radius:3px;padding:0 1px}@media(max-width:780px){.app{grid-template-columns:1fr}.side{padding:18px}.docs{max-height:190px;overflow:auto}main{padding:20px 12px}.chat{min-height:520px}.msg{max-width:96%}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">문서 안에서 답을 찾습니다</div><div class="sub">HWPX 다중문서 · 완전 오프라인</div>
    <div class="drop" id="drop"><strong>HWPX를 여기에 놓으세요</strong><br><span class="sub">여러 파일을 한 번에 추가할 수 있습니다</span><br><label class="filebtn" for="files">문서 선택</label><input id="files" type="file" accept=".hwpx" multiple></div>
    <div id="docs" class="docs"><div class="empty">불러온 문서가 없습니다.</div></div>
    <div class="sideactions"><button id="exportBtn">JSON 내보내기</button><button id="clearBtn">전체 초기화</button></div>
    <div class="privacy">🔒 파일은 이 브라우저 안에서만 처리되며 외부로 전송되지 않습니다.</div>
  </aside>
  <main><div class="shell">
    <div class="hero"><h1>폐쇄망 문서검색 챗봇</h1><p>질문과 가장 가까운 원문 문단을 근거와 함께 보여드립니다.</p></div>
    <section class="chat"><div id="messages" class="messages"><div class="msg bot welcome"><strong>안녕하세요.</strong><br>왼쪽에서 HWPX 문서를 추가한 뒤 질문해 주세요. 법령은 조문 단위, 일반 문서는 제목과 문단 단위로 찾아봅니다.</div></div>
      <form id="form" class="composer"><input id="query" autocomplete="off" placeholder="예: 자가품질검사의 의무는 무엇인가요?" aria-label="질문"><button id="ask" disabled>검색</button></form>
    </section>
  </div></main>
</div>
<script>
"use strict";
const S={docs:[]};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function u16(v,o){return v.getUint16(o,true)} function u32(v,o){return v.getUint32(o,true)}
async function unzip(buf){const v=new DataView(buf), b=new Uint8Array(buf);let e=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(u32(v,i)===0x06054b50){e=i;break}if(e<0)throw Error('HWPX ZIP 정보를 찾지 못했습니다.');let n=u16(v,e+10),p=u32(v,e+16),out={};for(let k=0;k<n;k++){if(u32(v,p)!==0x02014b50)break;let method=u16(v,p+10),cs=u32(v,p+20),ns=u16(v,p+28),xs=u16(v,p+30),ms=u16(v,p+32),lo=u32(v,p+42);let name=new TextDecoder().decode(b.slice(p+46,p+46+ns));let lns=u16(v,lo+26),lxs=u16(v,lo+28),raw=b.slice(lo+30+lns+lxs,lo+30+lns+lxs+cs);if(!name.endsWith('/')){if(method===0)out[name]=raw;else if(method===8){if(!('DecompressionStream'in window))throw Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge를 사용하세요.');out[name]=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}}p+=46+ns+xs+ms}return out}
function xmlText(bytes){let s=new TextDecoder('utf-8').decode(bytes),doc=new DOMParser().parseFromString(s,'application/xml');if(doc.querySelector('parsererror'))return '';const paras=[];for(const p of doc.querySelectorAll('p')){let t=[...p.querySelectorAll('t')].map(x=>x.textContent).join('').replace(/\s+/g,' ').trim();if(t)paras.push(t)}if(!paras.length){let t=[...doc.querySelectorAll('t')].map(x=>x.textContent).join(' ').replace(/\s+/g,' ').trim();if(t)paras.push(t)}return paras.join('\n')}
function chunk(text,name){let lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),chunks=[],head='';for(const line of lines){if(/^(제\s*\d+\s*(장|절|조)|[0-9]+[.)]|[가-힣]{2,30}\s*$)/.test(line.slice(0,50)))head=line.slice(0,100);if(chunks.length&&chunks.at(-1).text.length+line.length<700&& !/^제\s*\d+\s*조/.test(line))chunks.at(-1).text+='\n'+line;else chunks.push({id:crypto.randomUUID(),source:name,heading:head||'본문',text:line})}return chunks.filter(x=>x.text.length>8)}
async function readFile(file){if(!file.name.toLowerCase().endsWith('.hwpx'))throw Error('HWPX 파일만 추가할 수 있습니다.');let z=await unzip(await file.arrayBuffer()),names=Object.keys(z).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!names.length)names=Object.keys(z).filter(n=>/\.xml$/i.test(n)&&/section|content/i.test(n));let text=names.map(n=>xmlText(z[n])).filter(Boolean).join('\n');if(!text)throw Error('본문 텍스트를 찾지 못했습니다.');return{id:crypto.randomUUID(),name:file.name,active:true,chunks:chunk(text,file.name)}}
function tokens(s){s=s.toLowerCase().replace(/[^0-9a-z가-힣\s]/g,' ');let w=s.split(/\s+/).filter(x=>x.length>1),g=[];for(const x of w){g.push(x);for(let i=0;i<x.length-1;i++)g.push(x.slice(i,i+2))}return g}
function search(q){let all=S.docs.filter(d=>d.active).flatMap(d=>d.chunks),qt=tokens(q);if(!qt.length)return[];let dfs={};for(const c of all){let set=new Set(tokens(c.text+' '+c.heading));for(const t of set)dfs[t]=(dfs[t]||0)+1}return all.map(c=>{let ts=tokens(c.text+' '+c.heading),freq={};for(const t of ts)freq[t]=(freq[t]||0)+1;let bm=0,match=0;for(const t of qt){let tf=freq[t]||0;if(tf){match++;let idf=Math.log(1+(all.length-(dfs[t]||0)+.5)/((dfs[t]||0)+.5));bm+=idf*(tf*2.2)/(tf+1.2*(.25+.75*ts.length/Math.max(1,all.reduce((a,x)=>a+tokens(x.text).length,0)/all.length)))}}let coverage=match/qt.length;return{...c,raw:bm*(.65+.35*coverage),coverage}}).filter(x=>x.raw>0).sort((a,b)=>b.raw-a.raw).slice(0,5).map((x,i,a)=>({...x,score:Math.round(100*(.35*x.coverage+.65*(x.raw/(a[0].raw||1))))}))}
function renderDocs(){let box=$('#docs');box.innerHTML=S.docs.length?'':'<div class="empty">불러온 문서가 없습니다.</div>';for(const d of S.docs){let el=document.createElement('div');el.className='doc';el.innerHTML=`<div class="docrow"><input type="checkbox" ${d.active?'checked':''} aria-label="검색 포함"><div class="docname" title="${esc(d.name)}">${esc(d.name)}</div><button class="remove" title="삭제">✕</button></div><small>${d.chunks.length}개 검색 문단</small>`;el.querySelector('input').onchange=e=>d.active=e.target.checked;el.querySelector('.remove').onclick=()=>{S.docs=S.docs.filter(x=>x.id!==d.id);renderDocs()};box.append(el)}$('#ask').disabled=!S.docs.some(d=>d.active);}
function addMsg(html,type='bot'){let x=document.createElement('div');x.className='msg '+type;x.innerHTML=html;$('#messages').append(x);x.scrollIntoView({behavior:'smooth',block:'end'})}
async function addFiles(files){for(const f of files)try{addMsg(`<strong>${esc(f.name)}</strong>을 분석하고 있습니다…`);let d=await readFile(f);S.docs.push(d);$('#messages').lastElementChild.remove();addMsg(`<strong>${esc(f.name)}</strong>에서 ${d.chunks.length}개 문단을 준비했습니다.`)}catch(e){addMsg(`<strong>${esc(f.name)}</strong>: ${esc(e.message)}`)}renderDocs()}
function highlight(t,q){let words=[...new Set(q.replace(/[^0-9a-z가-힣\s]/gi,' ').split(/\s+/).filter(x=>x.length>1))].sort((a,b)=>b.length-a.length);let safe=esc(t);for(const w of words)safe=safe.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);return safe}
$('#form').onsubmit=e=>{e.preventDefault();let q=$('#query').value.trim();if(!q)return;addMsg(esc(q),'user');$('#query').value='';let r=search(q);if(!r.length){addMsg('관련 문단을 찾지 못했습니다. 다른 표현이나 핵심 단어로 다시 검색해 보세요.');return}addMsg(`<strong>관련 근거 ${r.length}건</strong><div class="results">${r.map((x,i)=>`<article class="result"><div class="resulthead"><span class="rank">${i+1}</span><strong>${esc(x.heading)}</strong><span class="score">${x.score}%</span></div><div class="meta">${esc(x.source)}</div><div class="quote">${highlight(x.text,q)}</div></article>`).join('')}</div>`)};
$('#files').onchange=e=>{addFiles(e.target.files);e.target.value=''};for(const ev of['dragenter','dragover'])$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('drag')});for(const ev of['dragleave','drop'])$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('drag')});$('#drop').addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('#clearBtn').onclick=()=>{if(!S.docs.length)return;S.docs=[];renderDocs();$('#messages').innerHTML='<div class="msg bot welcome"><strong>초기화했습니다.</strong><br>새 HWPX 문서를 추가해 주세요.</div>'};
$('#exportBtn').onclick=()=>{if(!S.docs.length){addMsg('내보낼 문서가 없습니다.');return}let data={format:'hwpx-offline-search-v1',createdAt:new Date().toISOString(),documents:S.docs.map(({name,chunks})=>({name,chunks:chunks.map(({heading,text})=>({heading,text}))}))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='hwpx-search-index.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
</body>
</html>
